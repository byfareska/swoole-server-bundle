name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    tests:
        name: PHPUnit (PHP ${{ matrix.php }}, swoole ${{ matrix.swoole && 'on' || 'off' }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.5']
                swoole: [true, false]
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: ${{ matrix.swoole && 'swoole' || 'none, curl, dom, mbstring, tokenizer, xml, xmlwriter' }}
                  coverage: none

            - name: Install dependencies
              # Without the extension the suite runs against the shipped stubs.
              run: composer install --no-interaction --no-progress ${{ !matrix.swoole && '--ignore-platform-req=ext-swoole' || '' }}

            - name: Run tests
              run: vendor/bin/phpunit

    phpstan:
        name: PHPStan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none

            - name: Install dependencies
              run: composer install --no-interaction --no-progress --ignore-platform-req=ext-swoole

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

    coding-style:
        name: PHP-CS-Fixer
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none

            - name: Install dependencies
              run: composer install --no-interaction --no-progress --ignore-platform-req=ext-swoole

            - name: Check coding style
              # IGNORE_ENV: php-cs-fixer does not officially list PHP 8.5 yet.
              run: PHP_CS_FIXER_IGNORE_ENV=1 vendor/bin/php-cs-fixer check --diff
